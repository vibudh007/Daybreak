[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions/Daybreak.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_protocol = esptool
extra_scripts = scripts/custom_targets.py

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#5ccb951d346017005b1fff7289bf19a1904e2de3

build_src_filter =
    -<*>
    +<rewrite/>
    +<net/transit_api.cpp>
    +<net/home_assistant.cpp>
    +<ui/icons.cpp>
    +<ui/theme.cpp>
    +<ui/components.cpp>
    +<ui/text_keyboard.cpp>

build_flags =
    -I $PROJECT_DIR/include
    -D USER_SETUP_LOADED
    -include $PROJECT_DIR/include/User_Setup.h

[env:release]
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=3
    -Os

[env:debug]
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=4
    -Og
    -ggdb

[env:clean]
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -Os

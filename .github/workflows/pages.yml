name: Publish web installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release firmware for same-origin browser installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/firmware
          gh release download v3.0.13-dev --repo "$GITHUB_REPOSITORY" --dir docs/firmware --pattern '*_APP.bin' --pattern '*_BOOTLOADER.bin' --pattern '*_PARTITIONS.bin'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
